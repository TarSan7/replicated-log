services:
  master:
    build: ./master
    environment:
      PORT: 8080
      SECONDARIES: secondary1:8081,secondary2:8081
    ports:
      - "8080:8080"
    depends_on:
      - secondary1
      - secondary2

  # Only the public port (8080) is published; 8081 (/replicate) stays on the internal network.
  secondary1:
    build: ./secondary
    environment:
      NODE_NAME: secondary1
      PORT: 8080
      INTERNAL_PORT: 8081
      DELAY_MS: 0
    ports:
      - "8081:8080"

  secondary2:
    build: ./secondary
    environment:
      NODE_NAME: secondary2
      PORT: 8080
      INTERNAL_PORT: 8081
      DELAY_MS: 3000
    ports:
      - "8082:8080"
